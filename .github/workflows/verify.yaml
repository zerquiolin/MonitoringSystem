name: Verify portable monitoring
on: [push, pull_request]
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv monitoring-system/.venv && monitoring-system/.venv/bin/pip install -r monitoring-system/docker/control/requirements.lock.txt
      - run: npm ci && python monitoring-system/scripts/monitoring.py init && npm run build && npm test && npm run test:integration && npm run pack && node monitoring-system/scripts/package-test.mjs
  container:
    strategy:
      matrix: {platform: [linux/amd64, linux/arm64]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: monitoring-system/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: portable-observability:local
          load: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m venv monitoring-system/.venv && monitoring-system/.venv/bin/pip install -r monitoring-system/docker/control/requirements.lock.txt && python monitoring-system/scripts/monitoring.py init && npm ci && npm run build
      - run: docker compose -f monitoring-system/docker/compose.yaml up -d --no-build
      - run: nohup npm run demo > /tmp/demo.log 2>&1 &
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'evidence-${{ strategy.job-index }}', path: monitoring-system/artifacts/acceptance.json}
