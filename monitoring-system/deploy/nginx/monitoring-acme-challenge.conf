# Temporary HTTP-only vhost for the initial Let's Encrypt webroot challenge.
# Replace this with monitoring.macondosoftwares.com.conf after the cert is issued.
server {
    listen 80;
    server_name monitoring.macondosoftwares.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
