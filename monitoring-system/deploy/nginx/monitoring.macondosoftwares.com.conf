# Install in the existing Nginx conf.d directory after issuing the certificate.
server {
    listen 80;
    server_name monitoring.macondosoftwares.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name monitoring.macondosoftwares.com;

    ssl_certificate /etc/letsencrypt/live/monitoring.macondosoftwares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.macondosoftwares.com/privkey.pem;

    client_max_body_size 8m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass https://monitoring:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name monitoring.macondosoftwares.com;
    }
}
